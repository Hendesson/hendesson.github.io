project:
  type: website
  output-dir: _site

website:
  site-url: https://hendesson.github.io
  title: "Hendesson"
  description: "Geografia, clima e saúde: projetos, códigos e tutoriais."
  favicon: imagens/localdatasus-logo.png
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    left:
      - href: projetos.qmd
        text: Projetos
      - href: codigo.qmd
        text: Pacotes
      - href: tutoriais.qmd
        text: Tutoriais
      - href: artigos/index.qmd
        text: Artigos
      - href: cv.qmd
        text: Currículo
      - href: perguntas.qmd
        text: Dúvidas
    right:
      - text: "English"
        href: https://hendesson.github.io/en/
        aria-label: "English version"
      - icon: github
        href: https://github.com/Hendesson
        aria-label: GitHub
  # Barra lateral só das páginas do Guia de dados espaciais
  sidebar:
    - id: guia-espacial
      title: "Guia de dados espaciais"
      style: docked
      collapse-level: 2
      contents:
        - href: guia-espacial/index.qmd
          text: "Início"
        - section: "Guia"
          contents:
            - guia-espacial/guia/01-conceitos.qmd
            - guia-espacial/guia/02-formatos-e-servicos.qmd
            - guia-espacial/guia/03-fontes-de-dados.qmd
            - guia-espacial/guia/04-ferramentas.qmd
            - guia-espacial/guia/05-glossario.qmd
        - section: "Curso"
          contents:
            - guia-espacial/curso/00-ambiente-e-dados.qmd
            - guia-espacial/curso/01-sql-basico.qmd
            - guia-espacial/curso/02-joins-e-agregacoes.qmd
            - guia-espacial/curso/03-postgis.qmd
            - guia-espacial/curso/04-apuracao.qmd
            - guia-espacial/curso/05-priorizacao.qmd
            - guia-espacial/curso/06-python.qmd
            - guia-espacial/curso/07-power-bi.qmd
  page-footer:
    left: "© 2026 Hendesson Alves · Feito com [Quarto](https://quarto.org)"
    right:
      - icon: github
        href: https://github.com/Hendesson

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-title: "Nesta página"
    code-copy: true
    code-overflow: wrap
    lang: pt-BR
    smooth-scroll: true
    link-external-newwindow: true

# O site não executa código: os tutoriais mostram o código e imagens já prontas.
# (Assim o GitHub consegue montar o site sem baixar dados.)
execute:
  eval: false
