# DOIs do Zenodo do Guia de dados espaciais e dos Artigos.
#
# 1. Crie um registro no Zenodo para cada linha (veja _zenodo/LEIAME.md) e copie o DOI
#    reservado, no formato 10.5281/zenodo.1234567.
# 2. Cole o DOI entre as aspas.
# 3. Rode:  python scripts/aplicar_doi.py
#    O DOI aparece no topo da página e no bloco "Como citar". Linhas vazias não mostram DOI.

